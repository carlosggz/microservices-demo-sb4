services:
  postgres:
    image: postgres:13.7
    container_name: demo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${MY_USER}
      POSTGRES_PASSWORD: ${MY_PASSWORD}
      POSTGRES_DB: demo
    networks:
      - my-network
  rabbitmq:
    image: rabbitmq:3.8.5-management-alpine
    container_name: demo-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${MY_USER}
      RABBITMQ_DEFAULT_PASS: ${MY_PASSWORD}
    networks:
      - my-network
  mongo:
    image: mongo:9.0
    container_name: demo-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MY_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MY_PASSWORD}
      MONGO_INITDB_DATABASE: demo
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - my-network

networks:
  my-network:
    driver: bridge
