subprojects {
    apply plugin: 'java'

    group = 'org.example'

    ext {
        springCloudVersion = "2025.1.3"
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}