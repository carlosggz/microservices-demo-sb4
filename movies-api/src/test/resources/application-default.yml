app:
  postgres:
    username: sa
    password: ""
    database: movies
    schema: movies_api
    host: localhost
    port: 5555
  config-server:
    username: uuu
    password: ppp
    url: http://localhost:1234
  rabbitmq:
    username: xxx
    password: yyy
    host: localhost
    port: 6666
    virtual-host: /
  eureka:
    url: http://xxx:yyy@localhost:7777/eureka
  swagger:
    enabled: false

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false;INIT=CREATE SCHEMA IF NOT EXISTS movies_api;
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    url: ${spring.datasource.url}
  config:
    import: optional:configserver:http://localhost:1234
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
