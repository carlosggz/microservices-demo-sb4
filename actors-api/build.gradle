plugins {
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '9.7.0'
}

version = '0.0.1-SNAPSHOT'
description = 'actors-api'

ext {
    set('springCloudVersion', "2025.1.3")
    set('mapstructVersion', "1.6.3")
    set('mongockVersion', '5.5.1')
}

dependencies {
    //spring cloud
    implementation platform("org.springframework.cloud:spring-cloud-dependencies:$springCloudVersion")

    //spring boot
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-stream'
    implementation 'org.springframework.cloud:spring-cloud-stream-binder-rabbit'

    //Mapstruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    //Mongock
    implementation "io.mongock:mongock-springboot:${mongockVersion}"
    implementation "io.mongock:mongodb-reactive-driver:${mongockVersion}"
    implementation 'org.mongodb:mongodb-driver-sync'

    //Mixed
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:3.1.1'

    //test
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
    testImplementation 'de.flapdoodle.embed:de.flapdoodle.embed.mongo.spring4x:4.24.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
